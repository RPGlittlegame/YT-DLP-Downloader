name: 自动打包程序

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Download ffmpeg
        run: |
          mkdir -p bin
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            curl -Lo bin/ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            unzip -oj bin/ffmpeg.zip 'ffmpeg*/bin/ffmpeg.exe' -d bin/
            rm bin/ffmpeg.zip
          else
            curl -Lo bin/ffmpeg.zip https://evermeet.cx/ffmpeg/ffmpeg-6.1.zip
            unzip -oj bin/ffmpeg.zip ffmpeg -d bin/
            chmod +x bin/ffmpeg
            rm bin/ffmpeg.zip
          fi
        shell: bash

      - name: PyInstaller Build
        run: |
          # 使用 .spec 文件进行打包以确保包含全部静态资源
          pyinstaller YT-DLP_Downloader.spec
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mkdir -p "dist/YT-DLP_Downloader/bin"
            cp bin/ffmpeg.exe "dist/YT-DLP_Downloader/bin/ffmpeg.exe"
          else
            mkdir -p "dist/YT-DLP_Downloader/bin"
            cp bin/ffmpeg "dist/YT-DLP_Downloader/bin/ffmpeg"
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-YT-DLP-Downloader-${{ github.run_number }}
          path: |
            dist/YT-DLP_Downloader/**
