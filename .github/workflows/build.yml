name: 自动打包程序

# 设置触发条件：当你推送代码到 main 分支，或者手动点击运行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    # 策略：同时在 Windows 和 macOS 上运行
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      # 1. 下载你的代码到虚拟机
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. 安装依赖（如果你有 requirements.txt 的话）
      - name: Install dependencies
        run: |
          pip install pyinstaller
          # 如果你有其他依赖，取消下面这一行的注释
          pip install -r requirements.txt

      # 4. 开始打包
      # 根据系统不同，执行不同的打包命令
      - name: Run PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile main.py  # 这里的 main.py 改成你的文件名

      - name: Run PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: pyinstaller --onefile --windowed main.py # 同上

      # 5. 把打好的包存起来，让你能下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-${{ matrix.os }}
          path: dist/
